# HDMapping Configuration File
# Generated by HDMapping v0.95.0
# Config version: 1.0
# Created on: Mar 28 2026
# 
# This file contains parameters organized in categories.
# Version information is stored in [version_info] section for compatibility checking.
#
# Livox Mid-360S, vertical handheld mount (cave/outdoor): IMU 500 Hz (firmware 35.1.1.13), 200k pts/s, Z-up NWU.
# Tuned on two indoor Mid-360S recordings (Livox 3 and 4, 2026-11-16 to 2026-11-24): lever arm, NDT Huber and information
# scale, the odometry settings of the Livox 4 map the user judged good, honest-inertial-carry layer 1 and the two loop
# closure rules. The values still marked TODO keep the L2's until they are measured on a Mid-360S.
# Stand still >= 1-2 s at the start (IMU gyro bias removal + initial map).

[version_info]
software_version = "0.1.0"
config_version = "1.0"
build_date = "Mar 28 2026"

[consistency]
# off since 2026-11-24 with the settings of the Livox 4 run the user judged (see the note at degenerate_projection_ratio)
use_consistency = false
num_constistency_iter = 10
consistency_gyro_rotation_term = false
consistency_gyro_sigma_scale = 3.0
consistency_gyro_gate_deg = 3.0

[evaluation]
holdout_block_s = 0.0

[filter_points]
# TODO: check for 200k pts/s (about 3x the L2)
decimation = 0.03
filter_threshold_xy_inner = 0.35
# Mid-360S: 40 m at 10 % reflectivity; points without a return come as (0, 0, 0) and are dropped by the inner filter
filter_threshold_xy_outer = 40.0
min_counter_concatenated_trajectory_nodes = 0
# also write scan_lio_merged.laz: all chunks in one file, world coordinates
export_merged_laz = true
threshould_output_filter = 0.4

[gyro_bias_estimation]
gyro_bias_initial_sigma_deg_s = 10.0
gyro_bias_max_deg_s = 20.0
gyro_bias_rw_deg_s_sqrt_s = 0.005
# 30 ms at the 500 Hz IMU
handoff_tail_nodes = 15
# 20 ms at the 500 Hz IMU
handoff_tail_velocity_span_nr_samples = 10
use_gyro_bias_estimation = true

[loop_closure]
# revisits (>= 8 m walked in between, within min(8 m, 0.5 x that path)) are registered and closed with a pose graph before the export
use_loop_closure = true
loop_closure_segment_windows = 6
loop_closure_min_path_m = 8.0
loop_closure_radius_per_path = 0.5
loop_closure_search_radius_m = 8.0
loop_closure_max_vertical_offset_m = 1.5
loop_closure_max_correction_m = 6.0
loop_closure_min_fitness = 0.5
loop_closure_odometry_sigma_m = 0.1
loop_closure_odometry_sigma_deg = 0.5
# blind-stretch rule: the odometry steps of a stretch where the LiDAR did not hold the travel are loosened along it, so a
# loop's correction lands there and is not spread over the walk (on since 2026-11-24, the user's decision on the Livox 4 maps)
loop_closure_odometry_from_readings = true
# match check: after the pruning, an edge the rest of the graph contradicts (tested with the edges that reuse its scans held
# out) is dropped; needs the blind-stretch rule (on since 2026-11-24)
loop_closure_match_check = true
loop_closure_edge_sigma_m = 0.05
loop_closure_edge_sigma_deg = 0.3
loop_closure_cross_floor_max_vertical_m = 6.0
loop_closure_cross_floor_min_fitness = 0.3
loop_closure_cross_floor_max_angle_deg = 10.0

[imu_translation]
# the motion edges follow the window's start velocity and acceleration offset (honest-inertial-carry layer 1): the LiDAR
# can correct a wrong carried speed after a blind stretch; on since 2026-11-25 (removed the Livox 4 corridor stall and its
# ghost wall; the user's look on Livox 4 and Livox 3)
imu_edges_follow_state = true
# Livox 3's good map (user's verdict 2026-11-16, run G): Huber kernel on the NDT points, NDT information and the
# position pull towards the guess both x0.1 (from Codex's build cbca36d), with the AHRS gain constant
ndt_huber_cutoff = 3.0
ndt_information_scale = 0.1
imu_position_information_scale = 0.1
# 2026-11-24, the user's decision: the settings of the Livox 4 run whose map the user judged good go into this file
# (experiments/consistency/livox4_lever/loop_capture/settings.toml): these two ratios (were 0.1 / 0.2),
# imu_acceleration_offset_rw_mps2_sqrt_s 0.01 (was 0.0001), use_exact_ndt_bucket_statistics true, use_consistency false,
# ahrs_gain 0.0 (was 0.05), gyro_scale_z 1.004 (this unit's gyro), and the two loop closure rules
degenerate_projection_ratio = 0.02
degenerate_projection_ratio_full = 0.04
imu_always_on = true
# TODO: measure on a static Mid-360S recording (L2 value)
imu_accel_noise_density_mps2_sqrt_hz = 0.0013
# TODO: walking vibration and unmodelled effects (L2 value)
imu_accel_floor_sigma_mps2 = 0.1
imu_velocity_initial_sigma_mps = 1.0
imu_zero_velocity_sigma_mps = 0.01
# 5 samples at 500 Hz; a stretch over 2 * span (20 ms) is a gap and loses its terms: about 9 lost samples in a row make
# one. A longer span gives fewer terms and less accelerometer information (the floor dominates each term's
# sigma). TODO: count the dropped terms on the first recording
imu_acceleration_span_s = 0.01
imu_acceleration_offset_initial_sigma_mps2 = 0.1
imu_acceleration_offset_rw_mps2_sqrt_s = 0.01
use_imu_translation_prediction = false
use_zero_velocity_detection = false

[in_out_params_indoor]
bounding_box_extension = 0.0
bounding_box_max_X = 0.0
bounding_box_max_Y = 0.0
bounding_box_max_Z = 0.0
bounding_box_min_X = 0.0
bounding_box_min_Y = 0.0
bounding_box_min_Z = 0.0
number_of_buckets = 0
number_of_buckets_X = 0
number_of_buckets_Y = 0
number_of_buckets_Z = 0
resolution_X = 0.15
resolution_Y = 0.15
resolution_Z = 0.15

[in_out_params_outdoor]
bounding_box_extension = 0.0
bounding_box_max_X = 0.0
bounding_box_max_Y = 0.0
bounding_box_max_Z = 0.0
bounding_box_min_X = 0.0
bounding_box_min_Y = 0.0
bounding_box_min_Z = 0.0
number_of_buckets = 0
number_of_buckets_X = 0
number_of_buckets_Y = 0
number_of_buckets_Z = 0
resolution_X = 0.4
resolution_Y = 0.4
resolution_Z = 0.4

[lidar_odometry_control]
# the sensor's range at 10 % reflectivity, as filter_threshold_xy_outer. TODO: compare with 25 on the first recording
max_distance_lidar = 40.0
min_distance_lidar = 0.15
min_distance_lidar_outdoor_grid = 1.0
nr_iter = 100
lm_factor_initial = 5.0
sliding_window_trajectory_length_threshold = 200.0
threshold_initial_points = 60000
# window of 0.36 s at the 500 Hz IMU
threshold_nr_poses = 180
use_exact_ndt_bucket_statistics = true
use_motion_from_previous_step = true

[lidar_odometry_debug_info]
calibration_validation_points = 1000000
log_iteration_convergence = false
log_stage_timing = false
log_window_diagnostics = false
log_window_terms = false
log_window_verdict = false
log_window_noise = false
save_calibration_validation = false

[lidar_imu_extrinsics]
# Mid-360S IMU position (user manual 3.5, native point axes): X = 0.011, Y = 0.02329, Z = -0.04412 (51.1 mm from the LiDAR
# origin). The recorder turns the axes for the hand-held mount (output = native Z, X, Y; points and IMU alike) and writes the
# IMU position in the output axes into every recording: timing*.json, imu_position_m = (-0.04412, 0.011, 0.02329). The setting
# is added to each point to express it at the IMU origin, so it is the negative of that position.
# History: 2026-11-22 first set as (-0.011, -0.02329, +0.04412), the manual's vector without the recorder's axis turn
# (692fd91; 88 mm off; the Livox 4 run with it is experiments/consistency/livox4_lever/physical). Corrected the same day
# after the axis audit (experiments/consistency/doubles/codex/analysis-codex.md: 48 axis permutations against the raw ray
# angles). This changes every Livox result: the Livox 3 end-run manifest does not match until it is re-recorded.
lidar_imu_lever_arm_x_m = 0.04412
lidar_imu_lever_arm_y_m = -0.011
lidar_imu_lever_arm_z_m = -0.02329

[madgwick_filter]
ahrs_gain = 0.0
fusionConventionEnu = false
fusionConventionNed = false
fusionConventionNwu = true
# TODO: set from the gyro noise at rest
startup_gyro_bias_max_variance_deg2_s2 = 5.0
# 1 s at the 500 Hz IMU
startup_gyro_bias_nr_samples = 500
use_remove_imu_bias_from_first_stationary_scan = true

[misc]
clear_color = [ 0.44999998807907104, 0.550000011920929, 0.6000000238418579, 1.0 ]

[motion_model_correction]
motion_model_correction_fi = 0.0
motion_model_correction_ka = 0.0
motion_model_correction_om = 0.0

[motion_model_first_node_prior_uncertainty]
lidar_odometry_motion_model_fix_origin_fi_1_sigma_deg = 1e-06
lidar_odometry_motion_model_fix_origin_ka_1_sigma_deg = 1e-06
lidar_odometry_motion_model_fix_origin_om_1_sigma_deg = 1e-06
lidar_odometry_motion_model_fix_origin_x_1_sigma_m = 1e-06
lidar_odometry_motion_model_fix_origin_y_1_sigma_m = 1e-06
lidar_odometry_motion_model_fix_origin_z_1_sigma_m = 1e-06

[motion_model_uncertainty]
lidar_odometry_motion_model_fi_1_sigma_deg = 0.17724539
lidar_odometry_motion_model_ka_1_sigma_deg = 0.26586808
lidar_odometry_motion_model_acc_1_sigma_mps2 = 1.0
max_prior_velocity_mps = 5.0
# 20 ms at the 500 Hz IMU
prior_velocity_span_nr_samples = 10
lidar_odometry_motion_model_om_1_sigma_deg = 0.17724539
lidar_odometry_motion_model_x_1_sigma_m = 1e-04
lidar_odometry_motion_model_y_1_sigma_m = 1e-04
lidar_odometry_motion_model_z_1_sigma_m = 1e-04
# The Mid-360S gyro's noise measured at rest (a recording of this sensor, 2-20 s at rest, 2026-11-15), used without
# inflation (k = 1): with the L2's values and k = 7.09 the LiDAR decided every window's rotation and bent windows by
# degrees against the gyro. The floor lies below the noise of one 2 ms IMU step and only guards against a zero sigma.
gyro_arw_x_deg_sqrt_s = 0.0094
gyro_arw_y_deg_sqrt_s = 0.0224
gyro_arw_z_deg_sqrt_s = 0.0144
rotation_sigma_floor_deg = 0.0002
rotation_sigma_inflation_k = 1.0
use_time_scaled_rotation_sigma = true

[paths]
current_output_dir = ''
working_directory_preview = ''

[performance]
real_time_threshold_seconds = 10.0

[sensor_calibration]
# gyro scale of the unit the recordings were made with (measured, change gyro-scale-correction); 1.0 for an unmeasured unit
gyro_scale_x = 1.0
gyro_scale_y = 1.0
gyro_scale_z = 1.004

