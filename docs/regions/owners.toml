# Who owns what in dMapper (stage 7 of docs/code-split-and-region-agents-plan.md). Checked by tools/region_owners.py.
#
# - `files`: files (or globs) a region owns whole.
# - `functions`: "file::function" entries; a function entry overrides its file's owner (a region's function in the
#   orchestrator's run_odometry.cpp; the back-end's run_consistency and the orchestrator's save_result in the front-end's
#   lidar_odometry.cpp).
# - `shared_tests`: test files whose cases don't separate by name; any region may add or change the cases of its own
#   code there, and the orchestrator reads that part of a branch's diff.
# - Whatever is not named here belongs to the orchestrator (the main session): shared types and settings, the window
#   loop's skeleton, capture and replay, the pipeline and the ports, the rest of infrastructure, the presentation layer,
#   CMake, settings/, CLAUDE.md, docs/, openspec/.
#
# A diagnostic of one term's fit belongs to the term's region (log_accelerometer_fit: inertial); a diagnostic of the
# balance between terms belongs to the noise-budget (the weak axis, the heading).
#
# A region's agent edits only what it owns; what it needs elsewhere it reports. See docs/regions/README.md.

