valid_for = { says = "a capture, the trajectory without the fine-time step, and the recording's point cache", outside = "another pose graph result or other eligible runs: exit 1" }
guards = { cases = ["Corridor.test_a_right_trajectory_stays", "Corridor.test_equal_jambs_at_equal_spacing_do_not_move_a_right_trajectory"], says = "a right trajectory is left alone" }

[bit_identity_kit]
what = "tools/compare_baseline.py, tools/step_checks.py, tools/kit_lib.py (the gate), tools/run_replay.py: does the code still give the same bits"
known_answer = { cases = ["CompareBaselineTests.test_folders_that_differ_only_in_run_dependent_fields_are_identical", "CompareBaselineTests.test_a_manifest_written_from_a_folder_is_identical_to_it_and_to_its_twin"], tolerance = "exact: folders that differ only in the run-dependent fields compare identical; a manifest written from a folder equals it; run_replay.py and the gate are checked by acceptance runs only" }
smallest_effect = { says = "one bit: files are compared by SHA-256 after normalising the fields a run changes; guards are exact hexadecimal doubles", cases = [] }
planted_fault = { cases = ["CompareBaselineTests.test_one_changed_byte_in_a_data_file_is_reported_by_name", "CompareBaselineTests.test_a_changed_setting_is_not_normalised_away", "StepChecksRegisterLineTest.test_an_identical_run_reports_the_count_and_a_missing_one_says_so"], says = "one flipped byte in a data file is named (1 of 5 files, exit 1); a changed setting is not normalised away; --record runs each guard twice and records only when the two runs agree", not_seen = "a difference inside the normalised fields (date-time, paths, commit, build date)" }
valid_for = { says = "one floating-point mode (/fp:precise) and one machine: bit identity across compilers or modes is not claimed", outside = "a Release folder configured as Debug is refused; a full run that stopped windows at the time limit depends on the machine's load (reported by the step checks from task 1.7)" }
guards = { cases = ["VerificationTests.test_build_refuses_a_release_folder_configured_as_debug"], says = "--record refuses uncommitted source changes; missing references stop it; a replay must say identical for every window; memory and slots through the gate" }

