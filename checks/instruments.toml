[check_register]
what = "checks/check_register.py: the register of the tests (cases, markers, assertions, helper calls, values) and the check of this file"
known_answer = { cases = ["ReaderTest.test_assertions_as_one_line_each_in_source_order", "ReaderTest.test_values_outside_bodies_members_and_tables", "ReaderTest.test_asserting_helper_closure_and_call_lines", "RealTreeTest.test_the_reader_reads_every_real_test_file_with_the_cross_count_holding"], tolerance = "exact: every construct read as written; on the real tree the reader's count of assertion macros equals a plain count in every file" }
smallest_effect = { says = "one changed character of a number or a comparison operator in an assertion, a value or a helper's argument; one marker; one case", cases = ["ComparisonTest.test_tolerance_loosened_in_an_assertion", "ComparisonTest.test_comparison_operator_turned_round_is_a_change"] }
planted_fault = { cases = ["ComparisonTest.test_tolerance_loosened_in_a_named_value", "ComparisonTest.test_tolerance_loosened_in_a_case_table_row", "ComparisonTest.test_tolerance_loosened_in_a_helpers_argument", "ComparisonTest.test_assertion_deleted", "ComparisonTest.test_assertion_commented_out", "ComparisonTest.test_if_zero_round_an_assertion", "ComparisonTest.test_ifdef_round_an_assertion", "ComparisonTest.test_skip_added", "ComparisonTest.test_should_fail_removed", "ComparisonTest.test_a_changed_generator_constant_is_a_value_changed", "InstrumentsTest.test_a_renamed_proof_fails_the_instrument_and_the_register_comparison"], says = "each planted edit is reported with its kind and exit code", not_seen = "limits computed while a test runs, assertions the flow never reaches, limits in src/, the meaning of a test, constants without a numeric literal" }
